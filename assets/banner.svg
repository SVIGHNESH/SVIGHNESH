<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Vighnesh Shukla — Backend • Sysadmin • Linux">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1a1b27"/>
      <stop offset="50%" stop-color="#24283b"/>
      <stop offset="100%" stop-color="#414868"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="260" fill="url(#bg)" rx="16"/>

  <!-- Subtle grid -->
  <g stroke="#7aa2f7" stroke-opacity="0.06">
    <path d="M0 40H1000M0 80H1000M0 120H1000M0 160H1000M0 200H1000M0 240H1000"/>
    <path d="M40 0V260M120 0V260M200 0V260M280 0V260M360 0V260M440 0V260M520 0V260M600 0V260M680 0V260M760 0V260M840 0V260M920 0V260"/>
  </g>

  <!-- Terminal window -->
  <g transform="translate(40,38)">
    <rect width="920" height="184" rx="12" fill="#16161e" stroke="#7aa2f7" stroke-opacity="0.25"/>
    <circle cx="22" cy="22" r="6" fill="#f7768e"/>
    <circle cx="42" cy="22" r="6" fill="#e0af68"/>
    <circle cx="62" cy="22" r="6" fill="#9ece6a"/>
    <text x="460" y="27" text-anchor="middle" fill="#565f89" font-family="Fira Code, monospace" font-size="12">vighnesh@linux — zsh — 100×20</text>

    <!-- Prompt lines -->
    <g font-family="Fira Code, JetBrains Mono, monospace" font-size="16">
      <text x="26" y="66" fill="#9ece6a">➜</text>
      <text x="48" y="66" fill="#7dcfff">~</text>
      <text x="68" y="66" fill="#c0caf5">whoami</text>

      <text x="26" y="106" fill="url(#name)" font-size="40" font-weight="700" filter="url(#glow)">
        Vighnesh Shukla
        <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
      </text>

      <text x="26" y="140" fill="#565f89">#</text>
      <text x="44" y="140" fill="#a9b1d6">
        Backend Developer • System Administrator • Linux Enthusiast
      </text>

      <text x="26" y="172" fill="#9ece6a">➜</text>
      <text x="48" y="172" fill="#7dcfff">~</text>
      <text x="68" y="172" fill="#c0caf5">cat ./now.txt</text>

      <text x="26" y="198" fill="#bb9af7">❯</text>
      <text x="48" y="198" fill="#c0caf5">learning</text>
      <text x="140" y="198" fill="#565f89">=</text>
      <text x="158" y="198" fill="#9ece6a">["java", "linux", "aws"]</text>

      <!-- Blinking cursor -->
      <rect x="400" y="184" width="10" height="18" fill="#c0caf5">
        <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
