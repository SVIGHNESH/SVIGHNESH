# Renders the contribution graph as an animated snake SVG and publishes it
# to the `output` branch. README.md embeds it from raw.githubusercontent.com,
# so no third-party widget host sits between GitHub and the image.
name: contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: SVIGHNESH
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353&color_snake=#58a6ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
